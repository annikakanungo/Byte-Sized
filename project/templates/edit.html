<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Byte-Sized - Edit Card</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Byte-Sized</h1>
    <nav>
        <a href="/">Back to all cards</a>
    </nav>

    <h2>Edit Card</h2>
    <form method="POST" action="/edit/{{ card['id'] }}">
        <label for="question">Question:</label>
        <input type="text" id="question" name="question" value="{{ card['question'] }}" required>

        <label for="answer">Answer:</label>
        <input type="text" id="answer" name="answer" value="{{ card['answer'] }}" required>

        <input type="submit" value="Update Card">
    </form>
</body>
</html>
